<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary SEO -->
    <title>GlobalLeap | Your Trusted Global Partner</title>

    <meta
      name="description"
      content="GlobalLeap helps businesses and individuals connect with global opportunities, services, and solutions. Explore GlobalLeap and discover what's possible worldwide."
    />

    <meta
      name="keywords"
      content="GlobalLeap, Global Leap, global business, global opportunities, international services, global solutions"
    />

    <meta name="author" content="GlobalLeap" />

    <!-- Search Engine Crawling -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://globaleap.in/" />

    <!-- Mobile / Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://globaleap.in/" />
    <meta property="og:title" content="GlobalLeap | Your Trusted Global Partner" />
    <meta
      property="og:description"
      content="Discover global opportunities, services, and solutions with GlobalLeap."
    />
    <meta property="og:site_name" content="Globaleap" />
    <meta
      property="og:image"
      content="https://globaleap.in/og-image.jpg"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GlobalLeap | Your Trusted Global Partner" />
    <meta
      name="twitter:description"
      content="Discover global opportunities, services, and solutions with GlobalLeap."
    />
    <meta
      name="twitter:image"
      content="https://globaleap.in/og-image.jpg"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/src/output.css" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
